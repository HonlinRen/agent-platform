global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yaml

scrape_configs:
  - job_name: agent-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: agent-rag
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
